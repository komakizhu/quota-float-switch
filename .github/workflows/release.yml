name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag -and -not $env:GITHUB_REF_NAME.StartsWith("$expectedTag-")) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
          }
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test -- --pool=forks --maxWorkers=1 --minWorkers=1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Prepare Tauri updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_B64" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_B64" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/quota-pro-updater.key"
          if [[ "$TAURI_SIGNING_PRIVATE_KEY_B64" == untrusted\ comment:* ]]; then
            # Accept a complete minisign key pasted directly into the secret.
            printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_B64" > "$key_path"
          else
            # The preferred format is Base64 of the complete .key file. Strip
            # whitespace so both wrapped and single-line Base64 secrets work.
            encoded_key=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_B64" | tr -d '[:space:]')
            if base64 --help 2>&1 | grep -q -- '--decode'; then
              printf '%s' "$encoded_key" | base64 --decode > "$key_path"
            else
              printf '%s' "$encoded_key" | base64 -D > "$key_path"
            fi
          fi
          chmod 600 "$key_path"
          if ! grep -q '^untrusted comment:' "$key_path"; then
            echo "TAURI_SIGNING_PRIVATE_KEY_B64 must be Base64 of the complete Tauri/minisign .key file (including its untrusted comment), or the complete key text" >&2
            exit 1
          fi
          # Tauri CLI and tauri-action both consume this value as the Base64
          # contents of the complete minisign key. Keep the decoded file only
          # for validation; passing its runner-specific path breaks the final
          # updater-signing step on Windows (the action tries to Base64-decode
          # the path itself).
          echo "TAURI_SIGNING_PRIVATE_KEY=$encoded_key" >> "$GITHUB_ENV"
      - name: Build macOS installer DMG with PKG and quarantine helper
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build -- --target universal-apple-darwin
      - name: Package macOS DMG contents
        if: runner.os == 'macOS' && hashFiles('src-tauri/target/universal-apple-darwin/release/bundle/macos/Quota Pro.app/Contents/Info.plist') != ''
        run: |
          chmod +x scripts/build-macos-dmg.sh
          scripts/build-macos-dmg.sh \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Quota Pro.app" \
            "${GITHUB_REF_NAME#v}" \
            "dist/release"
      - name: Upload macOS installer DMG artifact
        if: runner.os == 'macOS' && hashFiles('dist/release/*.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: quota-pro-macos-installer
          path: dist/release/*.dmg
      - name: Build Windows installers for artifact
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Upload Windows installer artifacts
        if: runner.os == 'Windows' && (hashFiles('src-tauri/target/release/bundle/msi/*.msi') != '' || hashFiles('src-tauri/target/release/bundle/nsis/*.exe') != '')
        uses: actions/upload-artifact@v4
        with:
          name: quota-pro-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quota Pro ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Ships Quota Pro 1.1.1 with an optional menu bar icon visibility setting in Settings → General.
            - Keeps the menu bar icon visible by default while persisting the user's choice across launches.
            - Rolls back the saved preference if the native menu bar visibility update fails.

            ![Quota Pro weekly quota fallback](https://raw.githubusercontent.com/komakizhu/Quota-Pro/main/docs/images/quota-v0.1.4-weekly-fallback.png)

            ## Privacy

            Quota Pro remains local-first: it reads the existing Codex Desktop login state only for quota requests and does not upload prompts, chats, raw quota responses, or local credentials.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
